name: Build NodeIDs for Geometry Dash 2.2092 (Windows)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Windows x64 / GD 2.2092
    runs-on: windows-latest
    steps:
      - name: Checkout repository and upstream source
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build Geode mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Win64
          sdk: given
      - name: Upload .geode package
        uses: actions/upload-artifact@v4
        with:
          name: NodeIDs-2.2092-Windows
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
